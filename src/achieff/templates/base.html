<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Achieff{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma.min.css') }}">
  </head>
  <body>
    <nav class="navbar is-dark" role="navigation" aria-label="Main">
      <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold" href="{{ url_for('onboard') }}">Achieff</a>
        <a
          role="button"
          class="navbar-burger"
          aria-label="Menu"
          aria-expanded="false"
          aria-controls="nav-menu"
          data-target="nav-menu"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
      <div id="nav-menu" class="navbar-menu">
        <div class="navbar-start">
          {% for item in pages %}
            <a
              class="navbar-item{% if page and item.key == page.key %} is-active{% endif %}"
              href="{{ item.path }}"
              {% if page and item.key == page.key %}aria-current="page"{% endif %}
            >{{ item.label }}</a>
          {% endfor %}
        </div>
        {% if viewer %}
          <div class="navbar-end">
            <div class="navbar-item">
              <span class="tag is-light">Signed in as {{ viewer.alias }}</span>
            </div>
            <div class="navbar-item">
              <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf" value="{{ csrf }}">
                <button class="button is-small is-light" type="submit">Log out</button>
              </form>
            </div>
          </div>
        {% endif %}
      </div>
    </nav>
    <main class="section">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
  </body>
</html>
