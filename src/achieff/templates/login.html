{% extends "base.html" %}
{% block title %}Log in · Achieff{% endblock %}
{% block content %}
  <h1 class="title">Log in</h1>
  <form method="post" action="{{ url_for('login_submit') }}" class="box">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label class="label" for="alias">Alias</label>
      <div class="control">
        <input class="input" id="alias" name="alias" autocomplete="username" required>
      </div>
    </div>
    <div class="field">
      <label class="label" for="key">Key</label>
      <div class="control">
        <input class="input" id="key" name="key" type="password" autocomplete="current-password" required>
      </div>
    </div>
    {% if error %}
      <p class="help is-danger">{{ error }}</p>
    {% endif %}
    <button class="button is-link" type="submit">Log in</button>
  </form>
{% endblock %}
