[project]
name = "achieff"
version = "0.0.0"
description = "Shipboard crew achievement board"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite",
    "hypercorn",
    "quart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
