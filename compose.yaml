name: achieff

services:
  achieff:
    build:
      context: .
      target: runtime
    image: achieff:local
    ports:
      - "10000:8080"
    environment:
      ACHIEFF_DATA_DIR: /data
      ACHIEFF_ENV: ${ACHIEFF_ENV:-production}
      ACHIEFF_SECRET_KEY: ${ACHIEFF_SECRET_KEY:-dev-only-change-me}
      ACHIEFF_BOOTSTRAP_ALIAS: ${ACHIEFF_BOOTSTRAP_ALIAS:-}
    volumes:
      - achieff-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  achieff-data:
